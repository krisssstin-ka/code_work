<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дуэль на кубиках</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background-color: #f0f2f5; color: #333; }
    .game-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; }
    h1 { color: #4a5568; }
    .dice { font-size: 80px; margin: 10px; transition: transform 0.3s; }
    .dice.rolling { transform: rotate(360deg) scale(1.2); }
    button { font-size: 20px; padding: 12px 35px; cursor: pointer; background-color: #4299e1; color: white; border: none; border-radius: 8px; margin-top: 20px; transition: background-color 0.2s; }
    button:hover { background-color: #3182ce; }
    .result { font-size: 26px; margin-top: 25px; font-weight: bold; height: 35px; color: #2d3748; }
    .players { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 20px; }
    .player-label { font-size: 18px; font-weight: 500; color: #718096; }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Дуэль на кубиках</h1>
    <div class="players">
      <div>
        <div class="player-label">Игрок</div>
        <div class="dice" id="playerDice">🎲</div>
      </div>
      <div style="font-size: 30px; font-weight: bold; color: #a0aec0;">VS</div>
      <div>
        <div class="player-label">Компьютер</div>
        <div class="dice" id="compDice">🎲</div>
      </div>
    </div>
    <button id="rollBtn">Бросить кубики</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    const playerDiceEl = document.getElementById('playerDice');
    const compDiceEl = document.getElementById('compDice');
    const resultEl = document.getElementById('result');
    const rollBtn = document.getElementById('rollBtn');

    rollBtn.addEventListener('click', () => {
      resultEl.textContent = '';
      rollBtn.disabled = true;
      
      playerDiceEl.classList.add('rolling');
      compDiceEl.classList.add('rolling');

      setTimeout(() => {
        playerDiceEl.classList.remove('rolling');
        compDiceEl.classList.remove('rolling');

        const p = Math.floor(Math.random() * 6) + 1;
        const c = Math.floor(Math.random() * 6) + 1;
        
        playerDiceEl.textContent = faces[p - 1];
        compDiceEl.textContent = faces[c - 1];

        if (p > c) resultEl.textContent = `Победа! (${p} : ${c})`;
        else if (p < c) resultEl.textContent = `Поражение (${p} : ${c})`;
        else resultEl.textContent = `Ничья (${p} : ${c})`;
        
        rollBtn.disabled = false;
      }, 500);
    });
  </script>
</body>
</html>
